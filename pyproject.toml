[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crypto-command-station"
version = "0.1.0"
description = "Deterministic, auditable Coinbase spot backtesting platform."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "coinbase-advanced-py>=1.8.4,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140.0",
    "import-linter>=2.7",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/command_station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.importlinter]
root_package = "command_station"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "production package does not depend on pytest"
type = "forbidden"
source_modules = ["command_station"]
forbidden_modules = ["pytest"]

[[tool.importlinter.contracts]]
name = "domain does not depend on market data"
type = "forbidden"
source_modules = ["command_station.domain"]
forbidden_modules = ["command_station.market_data"]
